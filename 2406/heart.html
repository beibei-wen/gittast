<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 粒子爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            cursor: pointer;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
        }

        /* 文字提示 */
        .hint {
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="hint">🖱️ 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放</div>

    <!-- Three.js CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============ 场景初始化 ============
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // OrbitControls - 鼠标交互
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.minDistance = 12;
        controls.maxDistance = 60;
        controls.target.set(0, 0, 0);
        controls.update();

        // ============ 灯光 ============
        const ambientLight = new THREE.AmbientLight(0x330022, 1.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff3366, 80, 60);
        pointLight1.position.set(10, 10, 15);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff6699, 50, 50);
        pointLight2.position.set(-10, -5, -10);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0xff0044, 40, 40);
        pointLight3.position.set(0, -8, 10);
        scene.add(pointLight3);

        // ============ 爱心形状函数 ============
        function heartShape(u, v) {
            // u: 0 to PI, v: 0 to 2*PI
            const scale = 3.5;
            const x = 16 * Math.pow(Math.sin(u), 3);
            const y = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
            const z = 0;

            // 给爱心增加厚度 (z轴)
            const thickness = 2.5 * Math.cos(v);
            const cosV = Math.cos(v);
            const sinV = Math.sin(v);

            return {
                x: x * scale * 0.18,
                y: y * scale * 0.18,
                z: thickness * 0.18 * (1 + 0.2 * Math.sin(u * 2))
            };
        }

        // ============ 创建粒子爱心 ============
        const particleCount = 8000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        // 颜色调色板 - 红色系渐变
        const colorPalette = [
            new THREE.Color('#ff1744'), // 亮红
            new THREE.Color('#ff4081'), // 粉红
            new THREE.Color('#f50057'), // 深粉
            new THREE.Color('#ff6d00'), // 橙红
            new THREE.Color('#ff3d00'), // 橘红
            new THREE.Color('#e91e63'), // 玫瑰红
            new THREE.Color('#ff5252'), // 浅红
            new THREE.Color('#d50000'), // 深红
        ];

        for (let i = 0; i < particleCount; i++) {
            // 使用参数方程生成爱心表面上的点
            const u = Math.random() * Math.PI;
            const v = Math.random() * Math.PI * 2;

            let point = heartShape(u, v);

            // 添加一些随机偏移，让爱心更自然
            const noiseScale = 0.3;
            const randomOffset = 1 + (Math.random() - 0.5) * noiseScale;

            positions[i * 3] = point.x * randomOffset + (Math.random() - 0.5) * 0.5;
            positions[i * 3 + 1] = point.y * randomOffset + (Math.random() - 0.5) * 0.5;
            positions[i * 3 + 2] = point.z * randomOffset + (Math.random() - 0.5) * 0.5;

            // 随机选择颜色
            const color = colorPalette[Math.floor(Math.random() * colorPalette.length)].clone();
            // 微调颜色亮度
            color.r += (Math.random() - 0.5) * 0.15;
            color.g += (Math.random() - 0.5) * 0.1;
            color.b += (Math.random() - 0.5) * 0.05;

            colors[i * 3] = Math.max(0, Math.min(1, color.r));
            colors[i * 3 + 1] = Math.max(0, Math.min(1, color.g));
            colors[i * 3 + 2] = Math.max(0, Math.min(1, color.b));

            // 粒子大小 - 边缘小，中心大
            const distFromCenter = Math.abs(point.z);
            sizes[i] = (0.06 + Math.random() * 0.14) * (1 - distFromCenter * 0.4);
        }

        // 创建粒子几何体
        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 创建圆形粒子贴图
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        // 绘制发光圆点
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.15, 'rgba(255, 200, 200, 0.95)');
        gradient.addColorStop(0.4, 'rgba(255, 100, 100, 0.6)');
        gradient.addColorStop(0.7, 'rgba(255, 30, 30, 0.15)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);

        const particleTexture = new THREE.CanvasTexture(canvas);

        // 粒子材质
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.25,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
        });

        const heartParticles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(heartParticles);

        // ============ 外层光晕粒子 ============
        const glowCount = 2000;
        const glowPositions = new Float32Array(glowCount * 3);
        const glowColors = new Float32Array(glowCount * 3);

        for (let i = 0; i < glowCount; i++) {
            const u = Math.random() * Math.PI;
            const v = Math.random() * Math.PI * 2;
            let point = heartShape(u, v);

            // 光晕粒子在爱心外围
            const spreadFactor = 1.3 + Math.random() * 0.8;
            glowPositions[i * 3] = point.x * spreadFactor + (Math.random() - 0.5) * 1.5;
            glowPositions[i * 3 + 1] = point.y * spreadFactor + (Math.random() - 0.5) * 1.5;
            glowPositions[i * 3 + 2] = point.z * spreadFactor + (Math.random() - 0.5) * 1.5;

            glowColors[i * 3] = 1.0;
            glowColors[i * 3 + 1] = 0.15 + Math.random() * 0.3;
            glowColors[i * 3 + 2] = 0.3 + Math.random() * 0.4;
        }

        const glowGeometry = new THREE.BufferGeometry();
        glowGeometry.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
        glowGeometry.setAttribute('color', new THREE.BufferAttribute(glowColors, 3));

        // 更大的发光粒子贴图
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 64;
        glowCanvas.height = 64;
        const glowCtx = glowCanvas.getContext('2d');
        const glowGradient = glowCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        glowGradient.addColorStop(0, 'rgba(255, 200, 200, 0.6)');
        glowGradient.addColorStop(0.3, 'rgba(255, 100, 100, 0.3)');
        glowGradient.addColorStop(0.6, 'rgba(255, 50, 50, 0.1)');
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        glowCtx.fillStyle = glowGradient;
        glowCtx.fillRect(0, 0, 64, 64);
        const glowTexture = new THREE.CanvasTexture(glowCanvas);

        const glowMaterial = new THREE.PointsMaterial({
            size: 0.5,
            map: glowTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false,
            vertexColors: true,
            transparent: true,
            opacity: 0.5,
            sizeAttenuation: true,
        });

        const glowParticles = new THREE.Points(glowGeometry, glowMaterial);
        scene.add(glowParticles);

        // ============ 背景星星 ============
        const starsCount = 1500;
        const starsPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 25 + Math.random() * 25;

            starsPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starsPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starsPositions[i * 3 + 2] = radius * Math.cos(phi);
        }

        const starsGeometry = new THREE.BufferGeometry();
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.06,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false,
            color: 0xffccdd,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true,
        });

        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // ============ 动画循环 ============
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 更新控制器
            controls.update();

            // 爱心微微脉动
            const pulse = 1 + Math.sin(elapsedTime * 1.5) * 0.03 + Math.sin(elapsedTime * 2.7) * 0.02;
            heartParticles.scale.setScalar(pulse);
            glowParticles.scale.setScalar(pulse * 1.05);

            // 光晕粒子旋转 (比爱心慢)
            glowParticles.rotation.y += 0.0008;
            glowParticles.rotation.x = Math.sin(elapsedTime * 2.0) * 0.08;

            // 背景星星缓慢旋转
            stars.rotation.y += 0.0003;
            stars.rotation.x += 0.0002;

            // 灯光动态变化
            pointLight1.intensity = 60 + Math.sin(elapsedTime * 0.7) * 15;
            pointLight2.intensity = 40 + Math.cos(elapsedTime * 0.9) * 12;

            renderer.render(scene, camera);
        }

        // ============ 响应窗口大小变化 ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============ 启动 ============
        animate();
        console.log('❤️ 爱心已就绪 - 拖拽鼠标旋转查看 3D 效果');
    </script>
</body>
</html>
