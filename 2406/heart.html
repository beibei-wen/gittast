<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 粒子爱心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000005;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }

        .hint {
            position: fixed;
            bottom: 28px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 10;
        }
        .msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6699;
            font-size: 18px;
            letter-spacing: 3px;
            text-align: center;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div class="hint">🖱 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放</div>
    <div class="msg" id="msg"></div>

    <!-- 传统 script 标签加载 Three.js（兼容所有手机浏览器） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

    <script>
    (function () {
        var msg = document.getElementById('msg');

        function showMsg(text) {
            msg.textContent = text;
            msg.style.display = 'block';
        }

        // 1. 检查 Three.js 是否加载成功
        if (typeof THREE === 'undefined') {
            showMsg('资源加载失败\n请检查网络后刷新');
            return;
        }

        // 2. 检查 WebGL 是否可用
        function hasWebGL() {
            try {
                var c = document.createElement('canvas');
                return !!(window.WebGLRenderingContext &&
                    (c.getContext('webgl') || c.getContext('experimental-webgl')));
            } catch (e) { return false; }
        }
        if (!hasWebGL()) {
            showMsg('当前浏览器不支持 WebGL\n请更换浏览器');
            return;
        }

        // 3. 检查 OrbitControls 是否加载
        if (typeof THREE.OrbitControls === 'undefined') {
            showMsg('控制器加载失败\n请检查网络后刷新');
            return;
        }

        // ==================== 场景 ====================
        var scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000005, 0.004);

        var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(0, -1, 36);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // ==================== 控制器 ====================
        var controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.minDistance = 10;
        controls.maxDistance = 70;
        controls.maxPolarAngle = Math.PI * 0.72;
        controls.target.set(0, -1.2, 0);
        controls.update();

        // ==================== 灯光 ====================
        scene.add(new THREE.AmbientLight(0x220022, 2.0));

        var keyLight = new THREE.PointLight(0xff2255, 95, 80, 1.5);
        keyLight.position.set(0, 3, 22);
        scene.add(keyLight);

        var fillLight = new THREE.PointLight(0xcc1155, 55, 60, 2);
        fillLight.position.set(0, -12, 2);
        scene.add(fillLight);

        var rimLight = new THREE.PointLight(0xff6699, 65, 55, 2);
        rimLight.position.set(0, 0, -18);
        scene.add(rimLight);

        // ==================== 粒子贴图工厂 ====================
        function glowTexture(inner, outer, size) {
            size = size || 128;
            var c = document.createElement('canvas');
            c.width = c.height = size;
            var ctx = c.getContext('2d');
            var h = size / 2;
            var g = ctx.createRadialGradient(h, h, 0, h, h, h);
            g.addColorStop(0, inner);
            g.addColorStop(0.06, inner);
            g.addColorStop(0.22, outer);
            g.addColorStop(0.55, 'rgba(255,30,50,0.04)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(c);
        }

        var texMain = glowTexture('rgba(255,255,255,1)', 'rgba(255,90,120,0.75)');
        var texSoft = glowTexture('rgba(255,200,200,0.5)', 'rgba(255,70,100,0.18)', 128);
        var texStar = glowTexture('rgba(255,255,255,0.85)', 'rgba(200,170,255,0.25)', 32);
        var texFountain = glowTexture('rgba(255,200,120,0.8)', 'rgba(255,90,40,0.25)', 48);

        // ==================== 实心爱心形状 ====================
        var HEART_SCALE = 0.24;

        function heartBoundary(u) {
            var bx = 16 * Math.pow(Math.sin(u), 3);
            var by = 13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
            return { x: bx * HEART_SCALE, y: by * HEART_SCALE };
        }

        function randomHeartPoint() {
            var u = Math.random() * Math.PI * 2;
            var b = heartBoundary(u);
            var fill = Math.random();
            var x = b.x * fill;
            var y = b.y * fill;
            var thickness = 2.0 * Math.sqrt(fill) * (0.3 + Math.random() * 0.7);
            var z = (Math.random() * 2 - 1) * thickness * (1 - Math.abs(y) / 5);
            return { x: x, y: y, z: z };
        }

        // ==================== 粒子流生命周期 ====================
        var TOTAL = 15000;
        var RISE_IN_END = 0.28;
        var HEART_END = 0.78;

        var targetPos = new Float32Array(TOTAL * 3);
        var startPos  = new Float32Array(TOTAL * 3);
        var endPos    = new Float32Array(TOTAL * 3);
        var baseCol   = new Float32Array(TOTAL * 3);
        var phase     = new Float32Array(TOTAL);
        var speed     = new Float32Array(TOTAL);
        var positions = new Float32Array(TOTAL * 3);
        var colors    = new Float32Array(TOTAL * 3);
        var sizes     = new Float32Array(TOTAL);

        var palette = [
            [1.0, 0.12, 0.28], [1.0, 0.22, 0.42], [0.98, 0.08, 0.36],
            [1.0, 0.35, 0.20], [0.95, 0.05, 0.25], [1.0, 0.18, 0.50],
            [0.96, 0.30, 0.35], [0.90, 0.10, 0.15],
        ];

        for (var i = 0; i < TOTAL; i++) {
            var pt = randomHeartPoint();
            targetPos[i*3]   = pt.x;
            targetPos[i*3+1] = pt.y;
            targetPos[i*3+2] = pt.z;

            startPos[i*3]   = pt.x * 0.25 + (Math.random() - 0.5) * 4;
            startPos[i*3+1] = -14 - Math.random() * 6;
            startPos[i*3+2] = pt.z * 0.25 + (Math.random() - 0.5) * 3;

            endPos[i*3]   = pt.x * 0.5 + (Math.random() - 0.5) * 7;
            endPos[i*3+1] = 12 + Math.random() * 6;
            endPos[i*3+2] = pt.z * 0.5 + (Math.random() - 0.5) * 4;

            var c = palette[Math.floor(Math.random() * palette.length)];
            baseCol[i*3]   = c[0];
            baseCol[i*3+1] = c[1];
            baseCol[i*3+2] = c[2];

            phase[i] = Math.random();
            speed[i] = 0.10 + Math.random() * 0.14;
            sizes[i] = 0.04 + Math.random() * 0.16;
        }

        var heartGeo = new THREE.BufferGeometry();
        heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        heartGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
        heartGeo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

        var heartMat = new THREE.PointsMaterial({
            size: 0.16,
            map: texMain,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            vertexColors: true,
            transparent: true,
            opacity: 0.95,
            sizeAttenuation: true,
        });

        var heartMesh = new THREE.Points(heartGeo, heartMat);
        scene.add(heartMesh);

        // ==================== 光晕外层 ====================
        var GLOW = 2500;
        var glowPos = new Float32Array(GLOW * 3);
        var glowCol = new Float32Array(GLOW * 3);

        for (var gi = 0; gi < GLOW; gi++) {
            var u2 = Math.random() * Math.PI * 2;
            var b2 = heartBoundary(u2);
            var r2 = 1.25 + Math.random() * 1.0;
            glowPos[gi*3]   = b2.x * r2 + (Math.random()-0.5)*2.0;
            glowPos[gi*3+1] = b2.y * r2 + (Math.random()-0.5)*2.0;
            glowPos[gi*3+2] = (Math.random()-0.5) * 2.0 * r2;
            glowCol[gi*3]   = 0.9 + Math.random()*0.1;
            glowCol[gi*3+1] = 0.08 + Math.random()*0.35;
            glowCol[gi*3+2] = 0.2 + Math.random()*0.45;
        }

        var glowGeo = new THREE.BufferGeometry();
        glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
        glowGeo.setAttribute('color',    new THREE.BufferAttribute(glowCol, 3));

        var glowMat = new THREE.PointsMaterial({
            size: 0.55, map: texSoft,
            blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
            vertexColors: true, transparent: true, opacity: 0.4, sizeAttenuation: true,
        });
        var glowMesh = new THREE.Points(glowGeo, glowMat);
        scene.add(glowMesh);

        // ==================== 底部粒子喷泉 ====================
        var FOUNTAIN = 2000;
        var fountainPos = new Float32Array(FOUNTAIN * 3);
        var fountainCol = new Float32Array(FOUNTAIN * 3);
        var fountainData = [];

        function resetFountain(i) {
            fountainPos[i*3]   = (Math.random()-0.5) * 12;
            fountainPos[i*3+1] = -14 - Math.random() * 6;
            fountainPos[i*3+2] = (Math.random()-0.5) * 6;
            fountainCol[i*3]   = 1;
            fountainCol[i*3+1] = 0.3 + Math.random()*0.4;
            fountainCol[i*3+2] = 0.15 + Math.random()*0.3;
            fountainData[i] = {
                life: 0,
                maxLife: 0.8 + Math.random() * 2.6,
                driftX: (Math.random()-0.5) * 3,
                driftZ: (Math.random()-0.5) * 1.8,
                baseX: fountainPos[i*3],
                baseZ: fountainPos[i*3+2],
            };
        }
        for (var fi = 0; fi < FOUNTAIN; fi++) {
            resetFountain(fi);
            fountainData[fi].life = Math.random() * fountainData[fi].maxLife;
        }

        var fountainGeo = new THREE.BufferGeometry();
        fountainGeo.setAttribute('position', new THREE.BufferAttribute(fountainPos, 3));
        fountainGeo.setAttribute('color',    new THREE.BufferAttribute(fountainCol, 3));

        var fountainMat = new THREE.PointsMaterial({
            size: 0.2, map: texFountain,
            blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
            vertexColors: true, transparent: true, opacity: 0.7, sizeAttenuation: true,
        });
        var fountainMesh = new THREE.Points(fountainGeo, fountainMat);
        scene.add(fountainMesh);

        // ==================== 增强星空 ====================
        var STAR = 4000;
        var starPos = new Float32Array(STAR * 3);
        var starCol = new Float32Array(STAR * 3);
        var starBase = new Float32Array(STAR * 3);
        var starTwinkle = new Float32Array(STAR);

        for (var si = 0; si < STAR; si++) {
            var theta = Math.random() * Math.PI * 2;
            var phi = Math.acos(2 * Math.random() - 1);
            var layer = Math.random();
            var r;
            if (layer < 0.12) r = 25 + Math.random() * 20;
            else if (layer < 0.45) r = 40 + Math.random() * 40;
            else r = 60 + Math.random() * 60;

            starPos[si*3]   = r * Math.sin(phi) * Math.cos(theta);
            starPos[si*3+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[si*3+2] = r * Math.cos(phi);

            var tint = Math.random();
            var cr, cg, cb;
            if (tint < 0.08)       { cr=0.6+Math.random()*0.4; cg=0.7+Math.random()*0.3; cb=0.9+Math.random()*0.1; }
            else if (tint < 0.15)  { cr=0.9+Math.random()*0.1; cg=0.7+Math.random()*0.3; cb=0.3+Math.random()*0.3; }
            else if (tint < 0.22)  { cr=0.9+Math.random()*0.1; cg=0.5+Math.random()*0.3; cb=0.2+Math.random()*0.2; }
            else {
                var b = 0.4 + Math.random() * 0.6;
                cr = b; cg = b * (0.8+Math.random()*0.2); cb = b * (0.75+Math.random()*0.25);
            }
            starBase[si*3]=cr; starBase[si*3+1]=cg; starBase[si*3+2]=cb;
            starCol[si*3]=cr; starCol[si*3+1]=cg; starCol[si*3+2]=cb;
            starTwinkle[si] = Math.random() * Math.PI * 2;
        }

        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color',    new THREE.BufferAttribute(starCol, 3));

        var starMat = new THREE.PointsMaterial({
            size: 0.3, map: texStar,
            blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
            vertexColors: true, transparent: true, opacity: 0.82, sizeAttenuation: true,
        });
        var stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ==================== 银河带 ====================
        var MILKY = 1200;
        var milkyPos = new Float32Array(MILKY * 3);
        var milkyCol = new Float32Array(MILKY * 3);

        for (var mi = 0; mi < MILKY; mi++) {
            var bandAngle = Math.random() * Math.PI * 2;
            var bandWidth = (Math.random() - 0.5) * 9;
            var bandHeight = (Math.random() - 0.5) * 2.5;
            var rr = 55 + Math.random() * 75;
            milkyPos[mi*3]   = Math.cos(bandAngle) * rr + bandWidth * Math.cos(bandAngle + Math.PI/2);
            milkyPos[mi*3+1] = bandHeight;
            milkyPos[mi*3+2] = Math.sin(bandAngle) * rr + bandWidth * Math.sin(bandAngle + Math.PI/2);
            var bb = 0.14 + Math.random() * 0.3;
            milkyCol[mi*3]=bb*0.7; milkyCol[mi*3+1]=bb*0.7; milkyCol[mi*3+2]=bb;
        }

        var milkyGeo = new THREE.BufferGeometry();
        milkyGeo.setAttribute('position', new THREE.BufferAttribute(milkyPos, 3));
        milkyGeo.setAttribute('color',    new THREE.BufferAttribute(milkyCol, 3));

        var milkyTex = glowTexture('rgba(180,180,255,0.3)', 'rgba(100,100,200,0.08)', 64);
        var milkyMat = new THREE.PointsMaterial({
            size: 0.8, map: milkyTex, blending: THREE.AdditiveBlending,
            depthWrite: false, depthTest: false, vertexColors: true,
            transparent: true, opacity: 0.35, sizeAttenuation: true,
        });
        var milkyWay = new THREE.Points(milkyGeo, milkyMat);
        milkyWay.rotation.x = 0.4;
        milkyWay.rotation.y = -0.3;
        scene.add(milkyWay);

        // ==================== 流星系统 ====================
        var MAX_METEORS = 4;
        var meteors = [];

        function spawnMeteor() {
            var start = new THREE.Vector3(
                (Math.random()-0.5) * 90,
                20 + Math.random() * 40,
                (Math.random()-0.5) * 90
            );
            var dir = new THREE.Vector3(
                (Math.random()-0.5) * 0.5,
                -1,
                (Math.random()-0.5) * 0.5
            ).normalize();

            var trailLen = 14 + Math.random() * 26;
            var trailN = 40;
            var tPos = new Float32Array(trailN * 3);
            var tCol = new Float32Array(trailN * 3);
            for (var ti = 0; ti < trailN; ti++) {
                var f = ti / trailN;
                tPos[ti*3]=start.x+dir.x*f*trailLen; tPos[ti*3+1]=start.y+dir.y*f*trailLen; tPos[ti*3+2]=start.z+dir.z*f*trailLen;
                var a = 1 - f;
                tCol[ti*3]=0.9*a; tCol[ti*3+1]=0.85*a; tCol[ti*3+2]=1*a;
            }
            var tGeo = new THREE.BufferGeometry();
            tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
            tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
            var tMat = new THREE.PointsMaterial({
                size: 0.32, map: texStar,
                blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
                vertexColors: true, transparent: true, opacity: 0.85, sizeAttenuation: true,
            });
            var trail = new THREE.Points(tGeo, tMat);

            var hGeo = new THREE.BufferGeometry();
            hGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([start.x,start.y,start.z]), 3));
            var hMat = new THREE.PointsMaterial({
                size: 0.9, map: glowTexture('rgba(255,255,255,1)','rgba(255,255,255,0.85)',32),
                blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
                color: 0xffffff, transparent: true, opacity: 1, sizeAttenuation: true,
            });
            var head = new THREE.Points(hGeo, hMat);

            var group = new THREE.Group();
            group.add(trail); group.add(head);
            scene.add(group);

            return {
                group: group, trail: trail, head: head,
                start: start.clone(), dir: dir.clone(),
                speed: 20 + Math.random() * 40,
                life: 0, maxLife: 1.3 + Math.random() * 2.5,
            };
        }

        // ==================== 缓动 ====================
        function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
        function easeInCubic(x)  { return x * x * x; }

        // ==================== 动画循环 ====================
        var clock = new THREE.Clock();
        var meteorTimer = 2.5;

        function animate() {
            requestAnimationFrame(animate);

            var dt = Math.min(clock.getDelta(), 0.1);
            var t = clock.elapsedTime;

            controls.update();

            // 主爱心粒子：自下而上流动
            for (var i = 0; i < TOTAL; i++) {
                phase[i] += dt * speed[i];
                if (phase[i] >= 1) phase[i] -= 1;

                var p = phase[i];
                var tx = targetPos[i*3], ty = targetPos[i*3+1], tz = targetPos[i*3+2];
                var sx = startPos[i*3],  sy = startPos[i*3+1],  sz = startPos[i*3+2];
                var ex = endPos[i*3],    ey = endPos[i*3+1],    ez = endPos[i*3+2];

                var x, y, z, brightness;

                if (p < RISE_IN_END) {
                    var q = p / RISE_IN_END;
                    var e = easeOutCubic(q);
                    x = sx + (tx - sx) * e;
                    y = sy + (ty - sy) * e;
                    z = sz + (tz - sz) * e;
                    brightness = 0.15 + 0.85 * q;
                } else if (p < HEART_END) {
                    var wob = Math.sin(t * 2.5 + i * 0.13) * 0.12;
                    x = tx + wob;
                    y = ty + Math.cos(t * 2.2 + i * 0.17) * 0.12;
                    z = tz + Math.sin(t * 2.0 + i * 0.11) * 0.1;
                    brightness = 1.0;
                } else {
                    var q2 = (p - HEART_END) / (1 - HEART_END);
                    var e2 = easeInCubic(q2);
                    x = tx + (ex - tx) * e2;
                    y = ty + (ey - ty) * e2;
                    z = tz + (ez - tz) * e2;
                    brightness = 1 - q2;
                }

                positions[i*3]   = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
                colors[i*3]   = baseCol[i*3]   * brightness;
                colors[i*3+1] = baseCol[i*3+1] * brightness;
                colors[i*3+2] = baseCol[i*3+2] * brightness;
            }
            heartGeo.attributes.position.needsUpdate = true;
            heartGeo.attributes.color.needsUpdate = true;

            var breathe = 1 + Math.sin(t * 0.8) * 0.02 + Math.sin(t * 2.1) * 0.015;
            heartMesh.scale.setScalar(breathe);
            heartMesh.rotation.y += dt * 0.05;
            glowMesh.scale.setScalar(breathe * 1.04);
            glowMesh.rotation.y += dt * 0.1;
            glowMesh.rotation.x = Math.sin(t * 1.5) * 0.05;

            // 底部喷泉
            for (var fi2 = 0; fi2 < FOUNTAIN; fi2++) {
                var d = fountainData[fi2];
                d.life += dt;
                if (d.life >= d.maxLife) resetFountain(fi2);
                var fp = d.life / d.maxLife;
                var rise = fp * 16;
                var fade = fp < 0.1 ? fp/0.1 : (1-fp);
                fountainPos[fi2*3]   = d.baseX + d.driftX * fp * 4;
                fountainPos[fi2*3+1] = -12 + rise;
                fountainPos[fi2*3+2] = d.baseZ + d.driftZ * fp * 3;
                fountainCol[fi2*3]   = 1 * fade;
                fountainCol[fi2*3+1] = (0.3 + fp*0.4) * fade;
                fountainCol[fi2*3+2] = (0.15 + fp*0.3) * fade;
            }
            fountainGeo.attributes.position.needsUpdate = true;
            fountainGeo.attributes.color.needsUpdate = true;

            // 星空闪烁
            for (var si2 = 0; si2 < STAR; si2++) {
                var tw = 0.5 + 0.5 * Math.sin(t * (1.5 + (si2%10)*0.3) + starTwinkle[si2]);
                starCol[si2*3]   = starBase[si2*3]   * tw;
                starCol[si2*3+1] = starBase[si2*3+1] * tw;
                starCol[si2*3+2] = starBase[si2*3+2] * tw;
            }
            starGeo.attributes.color.needsUpdate = true;
            stars.rotation.y += dt * 0.025;
            stars.rotation.x += dt * 0.012;
            stars.rotation.z += dt * 0.006;
            milkyWay.rotation.z += dt * 0.015;

            // 流星
            meteorTimer -= dt;
            if (meteorTimer <= 0 && meteors.length < MAX_METEORS) {
                meteors.push(spawnMeteor());
                meteorTimer = 2 + Math.random() * 5;
            }
            for (var mi2 = meteors.length - 1; mi2 >= 0; mi2--) {
                var m = meteors[mi2];
                m.life += dt;
                if (m.life >= m.maxLife) {
                    scene.remove(m.group);
                    m.trail.geometry.dispose(); m.trail.material.dispose();
                    m.head.geometry.dispose();  m.head.material.dispose();
                    meteors.splice(mi2, 1);
                    continue;
                }
                var prog = m.life / m.maxLife;
                m.group.position.copy(m.start.clone().add(m.dir.clone().multiplyScalar(m.speed * m.life)));
                var mfade = prog < 0.12 ? prog/0.12 : (prog > 0.65 ? (1-prog)/0.35 : 1);
                m.trail.material.opacity = 0.85 * mfade;
                m.head.material.opacity = mfade;
            }

            // 灯光呼吸
            keyLight.intensity = 90 + Math.sin(t*0.65)*18 + Math.sin(t*1.3)*8;
            fillLight.intensity = 52 + Math.sin(t*0.8)*10;
            rimLight.intensity = 60 + Math.cos(t*0.55)*12;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        meteors.push(spawnMeteor());
        animate();
    })();
    </script>
</body>
</html>
